<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">주주의 권리 2편 cover</title>
  <desc id="cover-desc">짙은 녹색 배경 왼쪽에 제목 배당일과 지분 희석, 오른쪽에 배당기준일이 표시된 달력과 신주가 늘어 조각이 작아지는 원형 지분 그래프 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3b33" />
      <stop offset="1" stop-color="#062320" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.4" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="930" cy="320" r="320" fill="url(#halo)" />
  <g fill="#134e4a" fill-opacity="0.8">
    <circle cx="1100" cy="90" r="6" /><circle cx="1130" cy="90" r="6" /><circle cx="1160" cy="90" r="6" />
    <circle cx="1100" cy="120" r="6" /><circle cx="1130" cy="120" r="6" /><circle cx="1160" cy="120" r="6" />
  </g>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="176" height="44" rx="22" fill="#5eead4" fill-opacity="0.15" stroke="#5eead4" stroke-opacity="0.7" />
    <text x="160" y="113" font-size="20" font-weight="700" fill="#99f6e4" text-anchor="middle">배당 · 유상증자</text>
    <rect x="264" y="84" width="72" height="44" rx="22" fill="#fbbf24" />
    <text x="300" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">2편</text>
    <text x="72" y="232" font-size="64" font-weight="800" fill="#f0fdfa">배당일과 희석</text>
    <text x="72" y="304" font-size="44" font-weight="700" fill="#ccfbf1">기준일 이틀 전에 사야 하는 이유</text>
    <rect x="72" y="344" width="96" height="6" rx="3" fill="#fbbf24" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#ccfbf1">배당락일 · 유상증자 · 최대주주</text>
    <text x="72" y="536" font-size="22" font-weight="700" fill="#f0fdfa">원금 보존 연구소</text>
    <text x="240" y="536" font-size="22" font-weight="400" fill="#ccfbf1">invest.route50.kr</text>
  </g>

  <!-- 달력 -->
  <g transform="translate(690 90) rotate(-5)" filter="url(#shadow)">
    <rect width="250" height="270" rx="18" fill="#f8fafc" />
    <path d="M0 18 a18 18 0 0 1 18 -18 H232 a18 18 0 0 1 18 18 V70 H0 Z" fill="#dc2626" />
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
      <text x="125" y="50" font-size="30" font-weight="800" fill="#ffffff">배당기준일</text>
      <text x="125" y="156" font-size="64" font-weight="800" fill="#1e293b">T</text>
      <text x="125" y="214" font-size="30" font-weight="700" fill="#0f766e">T-2일 매수</text>
      <text x="125" y="250" font-size="24" font-weight="500" fill="#475569">결제까지 2거래일</text>
    </g>
  </g>

  <!-- 희석되는 원형 그래프 -->
  <g transform="translate(1010 462)" filter="url(#shadow)">
    <circle r="100" fill="#475569" />
    <path d="M0 0 L0 -100 A100 100 0 0 1 100 0 Z" fill="#fbbf24" />
    <circle r="44" fill="#062320" />
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
      <text y="10" font-size="28" font-weight="800" fill="#fcd34d">25%</text>
    </g>
  </g>
</svg>
