<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">발행시장 vs 유통시장 cover</title>
  <desc id="cover-desc">짙은 청록색 배경 왼쪽에 제목 발행시장 vs 유통시장, 오른쪽 위에 회사 건물에서 투자자에게 주식 증서가 건너가는 발행시장 카드, 오른쪽 아래에 거래소 건물 앞에서 투자자끼리 주식을 주고받는 유통시장 카드</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b46" />
      <stop offset="1" stop-color="#071f2e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="900" cy="320" r="340" fill="url(#glow)" />
  <g stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="592" x2="1200" y2="592" />
  </g>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="176" height="44" rx="22" fill="#2dd4bf" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.7" />
    <text x="160" y="113" font-size="20" font-weight="700" fill="#99f6e4" text-anchor="middle">주식 · 시장 구조</text>

    <text x="72" y="236" font-size="64" font-weight="800" fill="#f8fafc">발행시장</text>
    <text x="72" y="312" font-size="64" font-weight="800" fill="#fbbf24">vs 유통시장</text>
    <rect x="72" y="344" width="96" height="6" rx="3" fill="#fbbf24" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#cbd5e1">공모주 청약 · 상장일 · 장외거래</text>

    <text x="72" y="536" font-size="22" font-weight="700" fill="#e2e8f0">원금 보존 연구소</text>
    <text x="240" y="536" font-size="22" font-weight="400" fill="#94a3b8">invest.route50.kr</text>
  </g>

  <!-- 위 카드: 발행시장 -->
  <g transform="translate(676 64)" filter="url(#shadow)">
    <rect width="460" height="220" rx="20" fill="#f8fafc" />
    <rect x="0" y="0" width="460" height="52" rx="20" fill="#fbbf24" />
    <rect x="0" y="30" width="460" height="22" fill="#fbbf24" />
    <text x="28" y="36" font-size="24" font-weight="800" fill="#1c1917" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">발행시장</text>
    <!-- 회사 건물 -->
    <g fill="#0b3b46">
      <rect x="40" y="96" width="76" height="96" />
      <rect x="116" y="124" width="48" height="68" />
    </g>
    <g fill="#99f6e4">
      <rect x="52" y="108" width="14" height="14" /><rect x="76" y="108" width="14" height="14" />
      <rect x="52" y="134" width="14" height="14" /><rect x="76" y="134" width="14" height="14" />
      <rect x="52" y="160" width="14" height="14" /><rect x="76" y="160" width="14" height="14" />
      <rect x="126" y="136" width="12" height="12" /><rect x="144" y="136" width="12" height="12" />
    </g>
    <!-- 주식 증서 -->
    <g transform="translate(206 98) rotate(-6)">
      <rect width="96" height="66" rx="6" fill="#ffffff" stroke="#0b3b46" stroke-width="3" />
      <line x1="14" y1="20" x2="82" y2="20" stroke="#0b3b46" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="36" x2="68" y2="36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <circle cx="72" cy="48" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2" />
    </g>
    <!-- 화살표 -->
    <path d="M178 176 Q232 196 292 176" fill="none" stroke="#0b3b46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M280 164 L294 176 L278 186" fill="none" stroke="#0b3b46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 투자자 -->
    <circle cx="378" cy="124" r="22" fill="#0b3b46" />
    <path d="M338 192 Q338 150 378 150 Q418 150 418 192 Z" fill="#0b3b46" />
  </g>

  <!-- 아래 카드: 유통시장 -->
  <g transform="translate(676 326)" filter="url(#shadow)">
    <rect width="460" height="220" rx="20" fill="#f8fafc" />
    <rect x="0" y="0" width="460" height="52" rx="20" fill="#2dd4bf" />
    <rect x="0" y="30" width="460" height="22" fill="#2dd4bf" />
    <text x="28" y="36" font-size="24" font-weight="800" fill="#042f2e" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">유통시장</text>
    <!-- 투자자 왼쪽 -->
    <circle cx="82" cy="124" r="22" fill="#0b3b46" />
    <path d="M42 192 Q42 150 82 150 Q122 150 122 192 Z" fill="#0b3b46" />
    <!-- 거래소 건물 -->
    <g fill="#0b3b46">
      <path d="M170 112 L230 84 L290 112 Z" />
      <rect x="176" y="118" width="108" height="8" />
      <rect x="184" y="132" width="14" height="48" /><rect x="208" y="132" width="14" height="48" />
      <rect x="232" y="132" width="14" height="48" /><rect x="256" y="132" width="14" height="48" />
      <rect x="170" y="184" width="120" height="8" />
    </g>
    <!-- 양방향 화살표 -->
    <path d="M128 100 Q148 90 166 98" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <path d="M154 88 L168 98 L152 106" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M332 100 Q312 90 294 98" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <path d="M306 88 L292 98 L308 106" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 투자자 오른쪽 -->
    <circle cx="378" cy="124" r="22" fill="#0b3b46" />
    <path d="M338 192 Q338 150 378 150 Q418 150 418 192 Z" fill="#0b3b46" />
  </g>
</svg>
