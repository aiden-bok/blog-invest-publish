<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">주식에 물렸을 때 1편 표지</title>
  <desc id="d">짙은 남색 바탕 오른쪽에 파란 하락 캔들 차트와 점선으로 그은 평균 단가선이 있고, 왼쪽에 제목이 있는 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33" />
      <stop offset="1" stop-color="#1b2f55" />
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1080" cy="80" r="220" fill="#3182f6" fill-opacity="0.10" />
  <circle cx="620" cy="640" r="180" fill="#f04452" fill-opacity="0.08" />
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <path d="M620 150H1136M620 250H1136M620 350H1136M620 450H1136" />
  </g>
  <path d="M620 190H1136" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 10" />
  <text x="1136" y="170" text-anchor="end" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="700" fill="#fcd34d">내 평균 단가</text>
  <g filter="url(#sh)" stroke-width="4" stroke-linecap="round">
    <g stroke="#3182f6" fill="#3182f6">
      <path d="M660 200V300M690 230V330M750 280V380M810 330V430M870 360V450M960 400V500M1020 430V520M1080 460V540" />
      <rect x="648" y="215" width="24" height="70" rx="3" />
      <rect x="678" y="245" width="24" height="70" rx="3" />
      <rect x="738" y="295" width="24" height="70" rx="3" />
      <rect x="798" y="345" width="24" height="70" rx="3" />
      <rect x="858" y="372" width="24" height="64" rx="3" />
      <rect x="948" y="415" width="24" height="70" rx="3" />
      <rect x="1008" y="445" width="24" height="60" rx="3" />
      <rect x="1068" y="472" width="24" height="56" rx="3" />
    </g>
    <g stroke="#f04452" fill="#f04452">
      <path d="M720 270V330M930 380V450" />
      <rect x="708" y="285" width="24" height="30" rx="3" />
      <rect x="918" y="395" width="24" height="40" rx="3" />
    </g>
  </g>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" fill="#ffffff">
    <text x="80" y="250" font-size="76" font-weight="800">주식에 물렸을 때</text>
    <text x="80" y="345" font-size="76" font-weight="800">1. 원인과 비중</text>
    <rect x="80" y="372" width="300" height="10" rx="5" fill="#fcd34d" />
    <text x="80" y="450" font-size="32" fill="#cbd5e1">하락 원인, 본전 상승률, 투자금 비중 확인</text>
  </g>
</svg>
