<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">기본적 분석과 기술적 분석 비교</title>
  <desc id="diagram-desc">왼쪽 기본적 분석은 재무제표와 실적을 보고 종목을 고르는 데 쓰고, 오른쪽 기술적 분석은 주가와 거래량 차트를 보고 사고팔 때를 정하는 데 쓰는 비교 그림</desc>
  <defs>
    <style id="embedded-font" data-chars=",12·가거고균기는니다동두디래량르릅무방법보본분사산살석선술실쓰어언엇에을이자재적정제주지팔평표하">@font-face{font-family:BlogHand;src:url(data:font/woff2;base64,) format("woff2")}</style>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#cfdcec" stroke-width="1" />
    </pattern>
    <filter id="pen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect width="1200" height="600" rx="16" fill="#fdfbf6" />
  <rect x="12" y="12" width="1176" height="576" fill="url(#paper)" />
  <rect x="1" y="1" width="1198" height="598" rx="16" fill="none" stroke="#e5dccb" stroke-width="2" />

  <g filter="url(#pen)">
    <path d="M64 114 L330 111 L332 134 L66 137 Z" fill="#fde047" fill-opacity="0.6" />
    <path d="M76 186 L536 182 L540 546 L72 550 Z" fill="#86efac" fill-opacity="0.3" />
    <path d="M668 186 L1128 184 L1132 546 L664 548 Z" fill="#a5b4fc" fill-opacity="0.3" />
    <g fill="none" stroke="#1f2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 172 Q300 170 530 172 Q531 360 529 536 Q300 534 66 537 Q64 360 66 168 L84 173" />
      <path d="M67 176 Q300 169 532 175 Q528 360 531 532 Q300 538 69 534 Q68 360 70 171 L86 176" stroke-width="1.5" stroke-opacity="0.35" />
      <path d="M656 172 Q890 170 1124 172 Q1125 360 1123 536 Q890 534 658 537 Q656 360 658 168 L678 173" />
      <path d="M659 176 Q890 169 1126 175 Q1122 360 1125 532 Q890 538 661 534 Q660 360 662 171 L680 176" stroke-width="1.5" stroke-opacity="0.35" />
    </g>
    <g fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round">
      <path d="M95 221 A22 23.5 0 1 1 140 217 A23.5 22 0 1 1 101 210" />
      <path d="M687 221 A22 23.5 0 1 1 732 217 A23.5 22 0 1 1 693 210" />
    </g>
    <g fill="none" stroke="#1f2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 300 L250 298 L252 440 L108 442 Z" />
      <path d="M126 326 L232 325 M126 350 L232 349 M126 374 L200 373" />
    </g>
    <g fill="none" stroke-width="14" stroke-linecap="round">
      <path d="M310 430 L310 380" stroke="#f04452" />
      <path d="M350 430 L350 350" stroke="#f04452" />
      <path d="M390 430 L390 320" stroke="#f04452" />
      <path d="M430 430 L430 360" stroke="#f04452" />
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M720 440 L1090 440 M720 440 L720 290" stroke="#1f2a44" stroke-width="2.5" />
      <path d="M732 410 L782 380 L822 400 L872 340 L922 360 L972 310 L1032 330 L1082 290" stroke="#f04452" stroke-width="3" />
      <path d="M732 420 C800 410 880 380 940 360 S1040 330 1085 315" stroke="#3182f6" stroke-width="3" />
    </g>
  </g>

  <g font-family="BlogHand, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="104" font-size="42" font-weight="700" fill="#1f2a44">두 가지 분석 방법</text>
    <text x="64" y="156" font-size="28" fill="#4b5563">무엇을 보는지, 어디에 쓰는지가 다릅니다</text>

    <text x="118" y="228" font-size="30" font-weight="700" fill="#1f2a44" text-anchor="middle">1</text>
    <text x="164" y="232" font-size="34" font-weight="700" fill="#1f2a44">기본적 분석</text>
    <text x="300" y="276" font-size="26" fill="#374151" text-anchor="middle">재무제표 · 실적 · 자산</text>
    <text x="300" y="500" font-size="26" fill="#374151" text-anchor="middle">무엇을 살지 고르기</text>

    <text x="710" y="228" font-size="30" font-weight="700" fill="#1f2a44" text-anchor="middle">2</text>
    <text x="756" y="232" font-size="34" font-weight="700" fill="#1f2a44">기술적 분석</text>
    <text x="900" y="276" font-size="26" fill="#374151" text-anchor="middle">주가 · 거래량 · 이동평균선</text>
    <text x="900" y="500" font-size="26" fill="#374151" text-anchor="middle">언제 사고팔지 정하기</text>
  </g>
</svg>
