<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">주주의 권리 1편 cover</title>
  <desc id="cover-desc">짙은 남색 배경 왼쪽에 제목 주주의 권리, 오른쪽에 지분율을 나눈 원형 그래프와 안건 투표함이 겹쳐 있는 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d" />
      <stop offset="1" stop-color="#0b1226" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="900" cy="300" r="340" fill="url(#halo)" />
  <g stroke="#334155" stroke-opacity="0.7" stroke-width="1.5">
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="592" x2="1200" y2="592" />
  </g>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="176" height="44" rx="22" fill="#818cf8" fill-opacity="0.18" stroke="#a5b4fc" stroke-opacity="0.7" />
    <text x="160" y="113" font-size="20" font-weight="700" fill="#c7d2fe" text-anchor="middle">주식 · 지배구조</text>
    <rect x="264" y="84" width="72" height="44" rx="22" fill="#f59e0b" />
    <text x="300" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">1편</text>
    <text x="72" y="232" font-size="68" font-weight="800" fill="#f8fafc">주주의 권리</text>
    <text x="72" y="304" font-size="44" font-weight="700" fill="#cbd5e1">지분율이 정하는 표와 배당</text>
    <rect x="72" y="344" width="96" height="6" rx="3" fill="#f59e0b" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#cbd5e1">의결권 · 주주총회 · 우선주</text>
    <text x="72" y="536" font-size="22" font-weight="700" fill="#e2e8f0">원금 보존 연구소</text>
    <text x="240" y="536" font-size="22" font-weight="400" fill="#cbd5e1">invest.route50.kr</text>
  </g>

  <!-- 원형 지분 그래프: 30% / 25% / 45% -->
  <g transform="translate(860 270)" filter="url(#shadow)">
    <circle r="150" fill="#38bdf8" />
    <path d="M0 0 L0 -150 A150 150 0 0 1 142.7 46.4 Z" fill="#f59e0b" />
    <path d="M0 0 L142.7 46.4 A150 150 0 0 1 -88.2 121.3 Z" fill="#818cf8" />
    <circle r="62" fill="#14213d" />
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
      <text y="-4" font-size="30" font-weight="800" fill="#f8fafc">1주</text>
      <text y="30" font-size="26" font-weight="700" fill="#fcd34d">1표</text>
    </g>
  </g>

  <!-- 투표함 -->
  <g transform="translate(900 392) rotate(-3)" filter="url(#shadow)">
    <rect x="0" y="40" width="190" height="128" rx="14" fill="url(#box)" />
    <rect x="30" y="32" width="130" height="16" rx="8" fill="#92400e" />
    <rect x="42" y="0" width="106" height="78" rx="6" fill="#ffffff" transform="rotate(6 95 40)" />
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
      <text x="95" y="124" font-size="30" font-weight="800" fill="#78350f">안건 찬성</text>
    </g>
  </g>
</svg>
